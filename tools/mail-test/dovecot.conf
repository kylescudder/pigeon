protocols = imap
listen = *
ssl = required
ssl_cert = </pki/server.pem
ssl_key = </pki/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:/mail/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
passdb {
  driver = passwd-file
  args = /etc/dovecot/test-users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/mail
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
log_path = /dev/stderr
info_log_path = /dev/stdout
