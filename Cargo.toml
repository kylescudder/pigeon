[workspace]
resolver = "3"
members = ["crates/pigeon-core", "src-tauri"]
exclude = ["vendor/imap-proto"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
age = "0.12"
ammonia = "4.2"
hex = "0.4"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "hooks"] }
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zeroize = "1.9"

# Compatibility fixes for the parser required by imap 2.4; see vendor README.
[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
