name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    # x86_64-linux is the supported target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Verify frontend dependency hashes
        run: |
          tools/update-node-modules-hash.sh
          if ! git diff --exit-code -- nix/package.nix; then
            echo 'Dependency hashes are stale. Run tools/update-node-modules-hash.sh and commit nix/package.nix.' >&2
            exit 1
          fi
      - name: Flake checks (package, core and keyring tests, frontend, native self-test)
        run: nix flake check -L
      - name: Formatting
        run: |
          nix fmt -- --check flake.nix nix/*.nix nix/home-manager/*.nix nix/home-manager/tests/*.nix
          nix develop -c cargo fmt --all --check
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
  imap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verified TLS, STARTTLS, MIME, read-only sync, and attachment transfer checks
        run: tools/mail-test/run.sh
      - name: Patched parser upstream regression suite
        run: >-
          docker run --rm -v "$PWD":/src
          -v pigeon-cargo:/usr/local/cargo/registry -v pigeon-target:/src/target
          pigeon-linux-dev cargo test --release --locked
          --manifest-path vendor/imap-proto/Cargo.toml

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run end-to-end tests
        env:
          PIGEON_E2E_EVIDENCE: "1"
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e-ci
          bun run test:e2e 2>&1 | tee artifacts/e2e-ci/run.log
      - name: Save test reports and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          retention-days: 7
          path: |
            evidence/playwright/
            artifacts/e2e-ci/
